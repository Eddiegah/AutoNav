name: AutoNav CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python dependencies (no CARLA server needed)
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 matplotlib==3.8.4 scipy==1.13.1
          pip install carla==0.9.16 || echo "carla wheel unavailable on this runner — mock_carla covers it"

      - name: Install pygame (headless)
        run: pip install pygame==2.5.2

      - name: Run unit tests (all non-CARLA modules)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python src/test_modules.py

      - name: Run headless end-to-end smoke test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python src/smoke_test.py
